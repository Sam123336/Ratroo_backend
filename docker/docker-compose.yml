version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: transit_postgres
    restart: always
    environment:
      POSTGRES_USER: transit_admin
      POSTGRES_PASSWORD: transit_password
      POSTGRES_DB: transit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit_admin -d transit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
